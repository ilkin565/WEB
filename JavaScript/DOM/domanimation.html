<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>DOM Ani</title>
    <link rel="stylesheet" href="domanimation.css">
</head>
<body>
    <h1>Document Object Model Animation</h1>
    <div style="margin-bottom: 10px;">
        <label for="fontSize">Размер шрифта (px):</label>
        <input type="number" id="fontSize" min="8" max="72" value="16" step="1" onchange="changeFontSize()">
    </div>
    <div style="margin-bottom: 10px;">
        <label for="interval">Интервал (мс):</label>
        <input type="number" id="interval" min="1" max="60" value="5">
    </div>
    <button onclick="toggleMove()">Старт / Стоп</button>
    <div id="animation">Document Object Model Animation</div>

    <script src="domanimation.js"></script>
</body>
</html>
